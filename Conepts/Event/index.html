    <script type="text/javascript">
        window.onload = function() {
            alert('onload');
        }
        function ready() {
            alert('Ready');
        }
        document.addEventListener("DOMContentLoaded", ready);
        window.addEventListener("unload", function() {
            alert('unload');
        });
        window.onbeforeunload = function() {
  alert('onbeforeload')
};
    </script>
</head>
